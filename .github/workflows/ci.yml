name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13" # 与 MaiBot 1.3 镜像一致
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: pytest
        run: uv run pytest -q
      - name: 清单与版本号一致
        run: |
          manifest=$(python3 -c "import json;print(json.load(open('_manifest.json'))['version'])")
          project=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$manifest" = "$project" || { echo "_manifest.json($manifest) 与 pyproject.toml($project) 版本不一致"; exit 1; }
          python3 scripts/changelog_section.py "$manifest" > /dev/null  # 当前版本必须写了更新日志
